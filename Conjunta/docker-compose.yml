services:
  servidor:
    build: .
    container_name: chat_servidor
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - PYTHONUNBUFFERED=1
    # stdin_open y tty permiten la interactividad con la terminal del servidor
    # para que pueda escribir y difundir mensajes a todos los clientes.
    stdin_open: true
    tty: true
    restart: unless-stopped
